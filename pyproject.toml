[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "closecode-ai"
version = "0.5.0"
description = "CloseCode — an agentic terminal coding assistant (LangGraph + OpenRouter + MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Om Gite" }]
dependencies = [
    "langchain",
    "langgraph",
    "langchain-huggingface",
    "langsmith",
    "huggingface_hub",
    "python-dotenv",
    "requests",
    "langchain-openai",
    "langchain-mcp-adapters",
    "mcp-server-git",
    "langchain-openrouter",
    "rich",
    "pyfiglet",
    "textual",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# `closecode` command -> main:cli_entry
[project.scripts]
closecode = "main:cli_entry"

[tool.pytest.ini_options]
# tests/ imports the app modules by bare name (flat layout), which
# tests/conftest.py arranges by putting the project root on sys.path.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::UserWarning:langchain_core.utils.pydantic",
]

# Flat layout: every top-level .py file is a module to ship.
[tool.setuptools]
py-modules = [
    "agent",
    "config",
    "debug_response",
    "guardrails",
    "harness",
    "llm",
    "main",
    "mcp_tools",
    "modes",
    "render",
    "search",
    "session",
    "todos",
    "token_tracker",
    "tools",
    "tui",
    "tui_messages",
    "tui_theme",
    "tui_widgets",
    "ui",
    "ui_prompts",
    "ui_theme",
]
